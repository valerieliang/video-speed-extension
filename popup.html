<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Speed Controller</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">

    <!-- Header -->
    <div class="header">
      <span class="logo">⚡</span>
      <h1>Video Speed Controller</h1>
      <span id="videoStatus" class="badge badge--off">No video</span>
    </div>

    <!-- Speed Control -->
    <div class="section">
      <span class="section-title">Playback Speed</span>

      <div class="speed-row">
        <button id="speedDown" class="btn btn-ghost">−</button>
        <div id="currentSpeed" class="speed-display">1.00x</div>
        <button id="speedUp" class="btn btn-ghost">+</button>
      </div>

      <div class="speed-range-wrap">
        <input type="range" id="speedSlider" min="0.1" max="4" step="0.05" value="1" />
      </div>

      <div class="speed-presets">
        <button class="preset" data-speed="0.5">0.5×</button>
        <button class="preset" data-speed="0.75">0.75×</button>
        <button class="preset active" data-speed="1">1×</button>
        <button class="preset" data-speed="1.25">1.25×</button>
        <button class="preset" data-speed="1.5">1.5×</button>
        <button class="preset" data-speed="1.75">1.75×</button>
        <button class="preset" data-speed="2">2×</button>
        <button class="preset" data-speed="2.5">2.5×</button>
        <button class="preset" data-speed="3">3×</button>
      </div>

      <div class="row" style="margin-top: 10px;">
        <button id="resetSpeed" class="btn btn-outline">Reset to 1×</button>
      </div>
    </div>

    <!-- Skip Controls -->
    <div class="section">
      <span class="section-title">Skip</span>
      <div class="row">
        <button id="skipBack30"    class="btn btn-skip">⏪ 30s</button>
        <button id="skipBack10"    class="btn btn-skip">⏪ 10s</button>
        <button id="skipForward10" class="btn btn-skip">10s ⏩</button>
        <button id="skipForward30" class="btn btn-skip">30s ⏩</button>
      </div>
    </div>

    <!-- Toggles -->
    <div class="section">
      <span class="section-title">Features</span>

      <div class="toggle-row">
        <label class="toggle-label">
          <input type="checkbox" id="skipSilenceToggle" />
          <span class="toggle-text">Skip Silence / Intros</span>
        </label>
      </div>

      <div class="toggle-row">
        <label class="toggle-label">
          <input type="checkbox" id="autoSkipSponsors" />
          <span class="toggle-text">SponsorBlock</span>
          <span class="badge badge--yt">YT</span>
        </label>
      </div>

      <div class="toggle-row" style="margin-top: 10px;">
        <button id="togglePip" class="btn btn-outline w-full">
          📺 Toggle Picture-in-Picture
        </button>
      </div>
    </div>

    <!-- Video Info -->
    <div class="section">
      <span class="section-title">Now Playing</span>
      <div id="videoInfo" class="video-info">No video detected on this page</div>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
